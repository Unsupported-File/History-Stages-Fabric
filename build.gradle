plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = "historystages.refmap.json"
	}

	mods {
		"historystages" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modCompileOnly files("C:/Users/Brend/.gradle/caches/modules-2/files-2.1/maven.modrinth/jade/11.13.1+fabric/511ff9de2b9322089e769433f8613f3ac16bdade/jade-11.13.1+fabric.jar")
	modCompileOnly files("C:/Users/Brend/.gradle/caches/modules-2/files-2.1/curse.maven/jei-238222/5772965/21cbc121dc37cefad4994f4987951cb6babcb42f/jei-238222-5772965.jar")
	modCompileOnly files("C:/Users/Brend/.gradle/caches/modules-2/files-2.1/dev.emi/emi-fabric/1.1.22+1.20.1/9758612bb346704a1b195488bb1888c01a391045/emi-fabric-1.1.22+1.20.1-api.jar")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
